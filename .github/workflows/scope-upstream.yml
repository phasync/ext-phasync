name: ext-scope is current

# scope/ is a git subtree of fiber-interop/ext-scope. Between releases main follows ext-scope's main
# (a release pins ext-scope's tag of that commit). This fails when ext-scope's main has moved, so an
# update is never missed: git subtree pull --prefix=scope https://github.com/fiber-interop/ext-scope.git main --squash
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scope/ is at ext-scope's main
        run: |
          split=$(git log -1 --grep='^git-subtree-dir: scope$' --format=%B | sed -n 's/^git-subtree-split: //p')
          sha=$(git ls-remote https://github.com/fiber-interop/ext-scope.git refs/heads/main | cut -f1)
          if [ "$split" != "$sha" ]; then
            echo "::error::scope/ is at ${split:-?}, ext-scope's main is $sha: git subtree pull --prefix=scope https://github.com/fiber-interop/ext-scope.git main --squash"
            exit 1
          fi
